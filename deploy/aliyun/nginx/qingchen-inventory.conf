# 青陈时尚出入库 — Nginx 反向代理
# 安装到：/etc/nginx/sites-available/qingchen-inventory
# 启用：ln -s /etc/nginx/sites-available/qingchen-inventory /etc/nginx/sites-enabled/
#
# 先用 HTTP 跑通，再用 04-setup-https.sh 申请证书并切换 HTTPS。

upstream qingchen_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 换成你的域名，如 inventory.example.com

    client_max_body_size 32m;

    # Let's Encrypt 校验（HTTPS 脚本会用到）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://qingchen_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Next.js 静态资源可略缓存
    location /_next/static/ {
        proxy_pass http://qingchen_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://qingchen_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }
}
